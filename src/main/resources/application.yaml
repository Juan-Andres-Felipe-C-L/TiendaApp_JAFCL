spring:
  application:
    name: TiendaApp

  datasource:
    url: jdbc:mysql://localhost:3306/tienda_db
    username: root
    password: "0000"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties: # Configuracion adicional
      hibernate:
        "[format_sql]": true # Formatea el lenguaje SQL

server:
  port: 9090
  servlet:
    context-path: /api/v1/tienda

security:
  jwt:
    secret-key: ${env.jwt.secret-key}
    token-expiration: ${env.jwt.token-expiration}
